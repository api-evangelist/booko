name: Booko
description: >-
  Booko is an Australian book, eBook, audiobook, DVD, music and collectibles
  price-comparison service operating since 2007. It aggregates new and used
  prices across many online retailers and regions, calculates shipping, and
  converts international prices to the shopper's local currency to surface the
  cheapest place to buy a title. Booko also offers shopping lists with bundled
  shipping calculations, barcode scanning, reading lists, price alerts and
  notifications. It is a consumer-facing comparison site rather than a retailer
  or a public API provider, earning referral fees from partner shops (including
  Amazon Associates) when shoppers buy through its links. Booko is a solo
  developer-run product surfaced through the API Evangelist network as a
  Y Combinator portfolio company.
